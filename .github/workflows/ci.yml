name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validar aplicação
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restaurar cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Conferir versões
        run: npm run release:verify

      - name: Validar frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Validar Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Cobertura de testes (frontend)
        run: npm run test:coverage

      - name: SCA — dependências npm
        run: npm audit --audit-level=high

      - name: SCA — dependências Rust
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
