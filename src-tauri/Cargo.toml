[package]
name = "hyperzettel"
version = "0.7.1"
description = "Hyperzettel desktop application"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hyperzettel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fastembed = {
  version = "=5.17.3",
  default-features = false,
  features = ["ort-download-binaries-rustls-tls"]
}
hex = "0.4"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
